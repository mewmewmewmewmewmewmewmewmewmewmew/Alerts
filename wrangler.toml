# Cloudflare Worker config for Mew Alerts.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "mew-alerts"
main = "src/index.js"
compatibility_date = "2025-01-01"

# KV namespace that stores the previous snapshot per monitor.
# Create it once:  npx wrangler kv namespace create MEW_STATE
# then paste the returned id below (replace REPLACE_WITH_KV_NAMESPACE_ID).
[[kv_namespaces]]
binding = "MEW_STATE"
id = "043a700a0872448c9d0e03c7cc016196"

# Cron trigger — runs the Tonamel poller (scheduled handler) every 5 minutes.
[triggers]
crons = ["*/5 * * * *"]

# LINE_TOKEN, GROUP_ID and ADMIN_PASSWORD are SECRETS — do not put them here.
# Set them with:
#   npx wrangler secret put LINE_TOKEN
#   npx wrangler secret put GROUP_ID
#   npx wrangler secret put ADMIN_PASSWORD   # enables the /admin filter editor
# (or in the Cloudflare dashboard: Worker ▸ Settings ▸ Variables and Secrets)
