name: Poll Tonamel

# Replaces Distill: runs a real browser on a schedule and posts each store's
# events to the Worker. Free on GitHub-hosted runners for public repos.
on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (UTC)
  workflow_dispatch: {} # lets you run it on demand from the Actions tab

concurrency:
  group: poll-tonamel
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Cache the Chromium download (~150MB) between runs. Keyed on the
      # Playwright version so a bump fetches a matching browser.
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-1.48.0

      # --omit=dev skips this repo's devDependencies (wrangler and its
      # workerd/esbuild/sharp tree) which the poller never uses; --no-save
      # keeps package.json untouched.
      - name: Install Playwright
        run: npm install --omit=dev --no-save playwright@1.48.0

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system deps (cached browser)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Poll stores and post to the Worker
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: node scripts/poll.mjs
